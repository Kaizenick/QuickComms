name: Build macOS installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build universal DMG
        run: npm run desktop:build:macos

      - name: Verify microphone entitlement
        run: |
          codesign -d --entitlements :- \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/QuickComms.app \
            2>&1 | grep -q 'com.apple.security.device.audio-input'

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: QuickComms-macOS-Universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
