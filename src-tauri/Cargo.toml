[package]
name = "quickcomms"
version = "0.1.0"
description = "Minimal cross-platform gaming voice chat"
authors = ["QuickComms contributors"]
edition = "2021"

[lib]
name = "quickcomms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
