services:
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    restart: unless-stopped
    environment:
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
    networks: [quickcomms]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [quickcomms]

  coturn:
    image: coturn/coturn:4.17.2
    restart: unless-stopped
    command:
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${DOMAIN}
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --external-ip=${PUBLIC_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

networks:
  quickcomms:

volumes:
  caddy_data:
  caddy_config:
